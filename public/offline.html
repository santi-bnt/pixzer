<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>pixzer — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: #1d1d1f;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101014;
          color: #fff;
        }
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem
          max(2rem, env(safe-area-inset-bottom));
        place-items: center;
      }

      main {
        width: min(100%, 34rem);
      }

      .brand-logo {
        display: block;
        width: min(100%, 20rem);
        height: auto;
      }

      .brand-logo-dark {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .brand-logo-light {
          display: none;
        }

        .brand-logo-dark {
          display: block;
        }
      }

      h1 {
        margin: 3rem 0 0.75rem;
        font-size: clamp(2rem, 8vw, 3.25rem);
        letter-spacing: -0.05em;
      }

      p {
        color: #6e6e73;
        font-size: 1rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        p {
          color: #a1a1aa;
        }
      }

      a {
        display: inline-flex;
        min-height: 2.75rem;
        margin-top: 1rem;
        align-items: center;
        border-radius: 0.75rem;
        background: #d71920;
        padding: 0 1rem;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        a {
          background: #ff4545;
          color: #101014;
        }
      }

      a:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="brand-logo brand-logo-light"
        src="/brand/pixzer-logo-tv-vacia-negro.png"
        alt="pixzer — Your Games Anywhere."
      />
      <img
        class="brand-logo brand-logo-dark"
        src="/brand/pixzer-logo-tv-vacia-blanco.png"
        alt="pixzer — Your Games Anywhere."
      />
      <h1>You’re offline.</h1>
      <p>
        This page needs an internet connection. Previously downloaded games will
        be available here only after offline game support is implemented.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
